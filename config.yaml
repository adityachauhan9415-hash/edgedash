# EdgeDash configuration
# Values here are defaults; any key can be overridden via environment variable.
# Secrets (API tokens) must NOT be placed in this file — put them in .env.

job_search:
  target_role: "Data Engineer"
  city: "San Francisco, CA"

pipeline:
  fetch_agent: "Fetcher"
  score_agent: "Scorer"
  gap_agent: "GapAnalyzer"

sources:
  # Sources are queried in order.  Each name must match a key in the SOURCES
  # registry (edgedash/sources/__init__.py).
  enabled:
    - arbeitnow     # free, no token required
    # - apify       # requires APIFY_TOKEN in .env

storage:
  db_path: "edgedash.db"

profile:
  profile_path: "profile.yaml"

# Mine to edit — add aliases as I discover collisions in my data.
# Keys and values are lowercase. When uncertain, do NOT merge (rule 23).
# Node/Node.js and JavaScript are intentionally kept separate.
skill_aliases:
  k8s: kubernetes
  postgres: postgres
  postgresql: postgres
  psql: postgres
  gcp: gcp
  google cloud: gcp
  google cloud platform: gcp
  ml: machine learning
  machine learning: machine learning
  ci/cd: ci/cd
  ci cd: ci/cd
  cicd: ci/cd
  nodejs: node.js
  ci/cd pipelines: ci/cd
  ci/cd-pipelines: ci/cd

# ── Scoring weights (deterministic arithmetic — never sent to LLM) ──────────
scoring:
  target_seniority: "senior"
  # User skills — comma-separated via EDGEDASH_SKILLS env var
  # skills: "python, sql, spark"
  weights:
    skill_match:   0.45
    seniority_fit: 0.25
    location_fit:  0.15
    recency:       0.15
  batch_size: 25
